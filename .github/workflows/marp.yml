name: Deploy Marp slides to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slides with Marp CLI
        uses: docker://marpteam/marp-cli:latest
        with:
          args: --html slides/deck.md -o output/index.html
        env:
          MARP_USER: root:root

      - name: Fix output ownership
        run: sudo chown -R $(id -u):$(id -g) output

      - name: Copy images
        run: cp slides/*.jpg slides/*.png slides/*.jpeg slides/*.gif output/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
